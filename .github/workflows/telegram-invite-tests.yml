name: telegram-invite / Тесты

on:
  push:
    branches: ['**']
    paths: ['telegram-invite/**']
  pull_request:
    paths: ['telegram-invite/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: telegram-invite

jobs:
  offline:
    name: Тесты без сети
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Классификация проверяется отдельно, на живых переписках и с ключом
      # OpenRouter: python tools/eval_types.py run. Здесь только то, что
      # решается кодом.
      - name: Прогон
        run: python -m unittest discover -s tests -v
